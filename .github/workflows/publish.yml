name: Publish to PyPI

# Crie um "Trusted Publisher" em https://pypi.org/manage/account/publishing/
# apontando para este repositório e o workflow publish.yml. Depois é só
# publicar uma Release no GitHub.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
